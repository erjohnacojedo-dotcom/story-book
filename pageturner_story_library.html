<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PageTurner — Story Library</title>
<style>
:root{--ink:#24233a;--muted:#706f83;--paper:#fffdf9;--bg:#f5f2fb;--accent:#7357c8;--accent2:#f0eaff;--line:#e8e2f1;--shadow:0 12px 35px #30204b12}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:#fffdf9ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{max-width:1150px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{font-size:1.35rem;font-weight:900;color:var(--accent);text-decoration:none;letter-spacing:-.5px}
nav{display:flex;gap:8px;flex-wrap:wrap}nav a{color:var(--ink);text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:650}nav a:hover,nav a.active{background:var(--accent2);color:var(--accent)}
main{max-width:1150px;margin:auto;padding:28px 22px 60px}.hero{background:linear-gradient(120deg,#e9e1ff,#fff3e8);padding:42px 36px;border-radius:24px;margin-bottom:28px;display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:center}
.hero h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.12;margin:0 0 14px;letter-spacing:-1.5px}.hero p{color:#5f5872;max-width:650px}.hero-art{font-size:6rem;text-align:center;filter:drop-shadow(0 12px 8px #5b438022)}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:2px;color:var(--accent);font-weight:800}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:white;font:inherit;color:var(--ink)}.toolbar input{flex:1;min-width:200px}
.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:25px 0 15px}.section-title h2{margin:0;font-size:1.55rem}.count{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.book{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:245px}.book-top{display:flex;gap:14px;align-items:flex-start}.cover{width:78px;height:105px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;font-size:2.3rem;background:var(--cover,#e8e1ff);box-shadow:inset 0 0 0 1px #0000000b}.book h3{margin:0 0 4px;font-size:1.08rem;line-height:1.3}.author{font-size:.86rem;color:var(--muted)}.tag{display:inline-block;background:#f2eef9;color:#6c55a8;padding:3px 9px;border-radius:99px;font-size:.75rem;font-weight:750;margin-top:8px}.book p{color:#625d70;font-size:.9rem;margin:14px 0}.read{margin-top:auto;display:inline-block;background:var(--accent);color:white;text-decoration:none;text-align:center;padding:10px 14px;border-radius:11px;font-weight:750}.read:hover{background:#5e43b5}
.page{background:white;border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,48px);max-width:850px;margin:10px auto;box-shadow:var(--shadow)}.back{color:var(--accent);font-weight:750;text-decoration:none}.story-head{text-align:center;padding:18px 0 28px;border-bottom:1px solid var(--line)}.story-head .cover{width:100px;height:135px;margin:0 auto 15px;font-size:3rem}.story-head h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.15;margin:8px 0}.story-text{max-width:650px;margin:28px auto;font-family:Georgia,serif;font-size:1.12rem;line-height:1.95;color:#383347}.story-text h2{text-align:center;font-family:system-ui;font-size:1.2rem}.story-text p{text-indent:1.5em}.story-actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:22px}.story-actions a{color:var(--accent);font-weight:750;text-decoration:none}
.about{background:white;padding:26px;border-radius:18px;border:1px solid var(--line);margin-top:35px}.empty{grid-column:1/-1;text-align:center;background:white;padding:35px;border-radius:18px;color:var(--muted)}
footer{text-align:center;color:var(--muted);padding:25px;border-top:1px solid var(--line);font-size:.88rem}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}.hero-art{display:none}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.nav{justify-content:center}.hero{padding:28px 22px}.book{min-height:0}}
</style>
</head>
<body>
<header><div class="nav">
<a class="logo" href="#home">📚 PageTurner</a>
<nav aria-label="Main navigation">
<a href="#home">Home</a><a href="#library">Library</a><a href="#genres">Genres</a><a href="#about">About</a>
</nav></div></header>
<main id="app"></main>
<footer>© 2026 PageTurner Story Library · A student project made with HTML, CSS & JavaScript</footer>
<script>
const books=[
{title:"The Last Starlight",author:"Mira Sol",genre:"Fantasy",emoji:"✨",color:"#e7dcff",desc:"A girl discovers that the stars are disappearing—and she may be the only one who can bring them back.",chapter:"The Sky Went Quiet",story:["On the night the final star blinked, Amara found a silver key beneath her pillow. It was warm, as if someone had been holding it. Outside, the village gathered beneath a sky without a single light.","The key fit a tiny door in the oldest tree. Beyond it waited a staircase winding up into the dark. Amara took one breath and climbed, carrying the last spark of hope in her pocket."]},
{title:"Coffee for Two",author:"J. Reyes",genre:"Romance",emoji:"☕",color:"#f6dfcf",desc:"Two strangers keep leaving notes for each other at a neighborhood café.",chapter:"A Note on the Cup",story:["Every morning, Lia ordered a cappuccino and found a handwritten note tucked beneath the saucer. The messages were small: a joke, a quote, a question about the rain.","On Friday, she wrote back. The next morning, the reply waited: “Same table tomorrow?” Lia smiled. For the first time in months, tomorrow sounded wonderful."]},
{title:"The Clockmaker's Secret",author:"Theo Vale",genre:"Mystery",emoji:"🕰️",color:"#dce8f5",desc:"A broken clock reveals a clue to a disappearance that happened twenty years ago.",chapter:"At Twelve O'Clock",story:["When Noah repaired the clock in his grandfather's shop, it began ticking backward. At midnight, a hidden compartment opened and dropped a photograph onto the workbench.","On its back were three words: Find the river. Noah grabbed his coat. The clock struck one, though its hands pointed to twelve."]},
{title:"Orbit of Us",author:"Nina Park",genre:"Science Fiction",emoji:"🚀",color:"#d9e7ff",desc:"A young astronaut receives a message from Earth that hasn't been sent yet.",chapter:"Signal",story:["The message arrived during the quiet shift: “Whatever you do, don't come home.” It carried Earth's old emergency code and was dated three days in the future.","Captain Mina stared at the blue planet through the window. Then the station lights flickered, and a second message appeared: “We are already there.”"]},
{title:"The House on Maple Lane",author:"A. Cruz",genre:"Horror",emoji:"🏚️",color:"#e2e1e6",desc:"A new tenant hears footsteps in a house that has been empty for decades.",chapter:"The Upstairs Room",story:["The landlord said the upstairs room was locked for repairs. Yet every night, footsteps crossed its floor, stopping directly above the bed.","On the seventh night, Mara found the key under her pillow. She unlocked the door. The room was empty except for a mirror—and her reflection, still asleep downstairs."]},
{title:"The Day I Said Yes",author:"Sam Ellis",genre:"Coming of Age",emoji:"🌱",color:"#dff0df",desc:"A shy student learns to take chances during the last week of school.",chapter:"One Small Step",story:["When the teacher asked for volunteers for the talent show, Jules almost looked down. Instead, a hand rose—his own.","His knees shook all afternoon. But when the first chord rang out and his friends cheered, he understood: courage wasn't being fearless. It was beginning anyway."]},
{title:"The Golden Mango",author:"Luna Dela",genre:"Adventure",emoji:"🥭",color:"#ffedc9",desc:"Three cousins follow a map to a legendary tree deep in the jungle.",chapter:"The Map",story:["The map was drawn on the back of a recipe card, with a mango-shaped X near the river. Tita said it was only a family joke.","But the cousins packed water, rope, and snacks. By sunrise, they were following the trail—and the jungle seemed to be waiting for them."]},
{title:"A Recipe for Rain",author:"M. Santos",genre:"Slice of Life",emoji:"🌧️",color:"#dcecf1",desc:"A baker rebuilds her life one warm loaf at a time.",chapter:"Fresh from the Oven",story:["The bakery had been closed for months when Bea turned the key. Dust covered the counter, but the old oven still worked.","She baked one loaf and placed it by the window. A neighbor stopped, then another. By noon, the smell of bread had filled the street, and Bea no longer felt alone."]},
{title:"The Painted Door",author:"Ivy Hart",genre:"Thriller",emoji:"🚪",color:"#f1dfe6",desc:"A journalist finds a fresh painting on a door that should not exist.",chapter:"Don't Open",story:["The door appeared at the end of the newsroom hallway overnight. Its paint was wet, and a message had been brushed across it: DON'T OPEN.","Reporter Elise took a photo. In the image, someone stood behind the door, holding a phone. Her phone rang. The caller ID read: Elise."]},
{title:"Moonlight Melody",author:"R. Flores",genre:"Music",emoji:"🎵",color:"#e8ddff",desc:"A street musician discovers a melody that makes people remember.",chapter:"The Forgotten Song",story:["Kai played the tune beneath the station lights. A woman stopped, tears in her eyes, and whispered the name of a friend she had lost touch with.","Soon the crowd was humming. Kai had never written the song. It seemed to have been waiting in the city, searching for someone to play it."]},
{title:"The Friendly Ghost",author:"Poppy Lane",genre:"Comedy",emoji:"👻",color:"#e6f0ff",desc:"A ghost tries to scare a family but keeps accidentally helping them.",chapter:"Boo, I Guess",story:["The ghost practiced his frightening entrance for hours. When the family came home, he shouted, “Boo!” and accidentally fixed the broken lamp.","The little girl clapped. “Can you do the kitchen next?” The ghost sighed. It was hard to be terrifying when everyone thought you were handy."]},
{title:"Letters from Tomorrow",author:"Eli Winter",genre:"Drama",emoji:"✉️",color:"#f4e3d7",desc:"A mailbox delivers letters from the future to a lonely postman.",chapter:"The First Letter",story:["At first, the letters warned of ordinary things: bring an umbrella, call your sister, don't miss the bus. Then one arrived addressed to the postman himself.","It read, “You have one chance to make things right.” He looked across the street at the house he had avoided for ten years and started walking."]},
{title:"Wildwood Academy",author:"T. Morgan",genre:"School Life",emoji:"🎒",color:"#dcebdc",desc:"A new student finds a secret club hidden inside the school library.",chapter:"The Hidden Shelf",story:["The shelf moved only when someone said the library's oldest motto. Behind it was a room filled with student journals and strange inventions.","Maya had come to school hoping to disappear. Instead, she found a group that needed her ideas—and a place where she could belong."]},
{title:"The Little Inventor",author:"Benji Fox",genre:"Children",emoji:"🤖",color:"#ffe4b8",desc:"A kid builds a robot to help with chores, but it has its own plans.",chapter:"Beep's Big Idea",story:["Leo built Beep to tidy his room. Beep scanned the mess and announced, “Task updated: build a blanket fort.”","By sunset, the room was cleaner, the fort was enormous, and Leo had a new best friend who ran on batteries and imagination."]},
{title:"The Forest Guardian",author:"Aria Moss",genre:"Nature",emoji:"🌳",color:"#d8eedb",desc:"A young guardian protects a forest from a mysterious gray fog.",chapter:"The First Leaf",story:["When the fog crept between the trees, every bird fell silent. Neri placed a hand on the oldest oak and heard a faint heartbeat beneath its bark.","She planted a seed at the forest's edge. A green shoot rose through the gray soil. The trees answered with a rustle, and the fog began to retreat."]},
{title:"Midnight Express",author:"D. Blake",genre:"Crime",emoji:"🚆",color:"#e0e4ee",desc:"A detective has one train ride to uncover who stole a priceless necklace.",chapter:"The Last Carriage",story:["Detective Rowan checked the passenger list. Everyone had an alibi, everyone except the conductor, who claimed he had never seen the necklace.","The train entered a tunnel. When it emerged, Rowan held the necklace—and the conductor's ticket, stamped for a station that had closed years ago."]},
{title:"Summer at Blue Bay",author:"C. Rivera",genre:"Young Adult",emoji:"🏖️",color:"#d7eff8",desc:"A summer friendship turns into a journey of self-discovery by the sea.",chapter:"The Tide Pool",story:["At Blue Bay, Dani collected shells while Alex collected stories. They traded them every afternoon on the rocks.","On the final day, Dani left a shell in Alex's pocket. Inside it was a note: “The best part of summer wasn't the sea. It was meeting you.”"]},
{title:"The Crown of Ash",author:"S. Night",genre:"Epic Fantasy",emoji:"👑",color:"#f1d9d9",desc:"A blacksmith's apprentice is chosen to restore a fallen kingdom.",chapter:"The Ember",story:["The crown had been cold for a hundred years. When Taren touched it, a single ember glowed beneath the ash.","The old guard knelt. Taren did not. “I am no king,” he said. “Then lead us as something better,” answered the last queen."]},
{title:"Pixel Hearts",author:"Mika Chen",genre:"Virtual Reality",emoji:"🎮",color:"#dce5ff",desc:"Two gamers meet in a virtual world and discover a real-life connection.",chapter:"Player Two",story:["In the game, Nova always rescued the lost travelers. One night, a player named Sol asked why she never saved herself.","Nova laughed and told the truth: she was afraid to log out. Sol offered to meet her at the real-world café beside the arcade. She typed, “Okay. No avatars.”"]},
{title:"The Silent Witness",author:"K. Stone",genre:"Legal Drama",emoji:"⚖️",color:"#e8e3d9",desc:"A young lawyer finds evidence hidden in an old courtroom recording.",chapter:"Playback",story:["The recording contained no confession, only a faint knock at the exact moment the witness claimed to be alone.","Attorney Vale replayed it. Three knocks. A pause. Two more. The court stenographer recognized the rhythm—and finally spoke."]},
{title:"Beneath the Red Moon",author:"R. Hale",genre:"Paranormal",emoji:"🌕",color:"#f4dada",desc:"A village legend comes alive during an unusual lunar eclipse.",chapter:"The Warning",story:["Grandmother warned them never to look into the well beneath the red moon. Finn looked anyway.","His reflection smiled before he did. From the well came a voice that sounded exactly like his own: “Thank you for letting me out.”"]},
{title:"The Paper Kingdom",author:"M. Wren",genre:"Fairy Tale",emoji:"📜",color:"#f4e8c8",desc:"A folded paper bird leads a child to a kingdom that exists between pages.",chapter:"Folded Wings",story:["The paper bird flapped from the book and landed on Ada's palm. Its wings were creased with tiny golden roads.","She followed it into the story. The paper king offered her a crown, but Ada asked for a pencil instead. “I want to write what happens next.”"]},
{title:"A Thousand Miles Home",author:"N. Brooks",genre:"Travel",emoji:"🧭",color:"#d9e8e0",desc:"A traveler loses her map and learns to find her way through kindness.",chapter:"Wrong Turn",story:["Mina took the wrong bus and arrived in a town not marked on her map. Her phone had no signal, and the station was closing.","A baker offered directions and a warm bun. By morning, Mina had a new route—and a reminder that getting lost could lead somewhere good."]},
{title:"The Last Game",author:"J. Parker",genre:"Sports",emoji:"🏀",color:"#f8e2c8",desc:"An underdog basketball team gets one final chance to prove itself.",chapter:"Final Seconds",story:["The scoreboard showed two points behind and ten seconds left. Coach called a timeout, but nobody heard the plan over their pounding hearts.","Rafi passed instead of shooting. His teammate caught the ball and scored at the buzzer. They won together, just as they had practiced."]},
{title:"The Museum of Dreams",author:"A. Bloom",genre:"Magical Realism",emoji:"🖼️",color:"#e7ddf5",desc:"A museum curator discovers that every painting contains someone's forgotten dream.",chapter:"The Empty Frame",story:["The empty frame in Gallery Seven showed a different scene to every visitor. A beach, a childhood kitchen, a person they missed.","Curator June stepped inside and saw her own dream: a door opening onto a life she had postponed. She took a breath and went to find it."]},
{title:"Code of the Sea",author:"Finn Gray",genre:"Steampunk",emoji:"⚙️",color:"#dce9e9",desc:"A mechanic and a captain race a steam-powered ship to save their floating city.",chapter:"Pressure Rising",story:["The city's engines sputtered as the tide climbed. Mechanic Sol found a brass code etched into the old boiler.","With the captain steering and Sol turning the valves, the engine roared awake. The city lifted above the waves, its lanterns shining like a constellation."]},
{title:"The Wish Collector",author:"L. James",genre:"Inspirational",emoji:"⭐",color:"#fff0c9",desc:"An elderly shopkeeper collects wishes and helps people take the first step.",chapter:"One Wish Left",story:["People brought wishes in jars: a new job, a healed friendship, a chance to begin again. The collector never granted them—he asked what they would do first.","A child brought an empty jar. “I wish to be brave.” The collector handed her a tiny seed. “Then plant this. Bravery grows.”"]},
{title:"Winter's Promise",author:"E. North",genre:"Historical Fiction",emoji:"❄️",color:"#dce9f5",desc:"During a harsh winter, two neighbors work together to keep their village alive.",chapter:"The First Snow",story:["Snow buried the road before dawn. Anya found her neighbor's door blocked and began digging with a wooden shovel.","Soon the whole village joined. By evening, paths connected every home. The winter was still cold, but nobody had to face it alone."]},
{title:"The Dragon Next Door",author:"P. Ember",genre:"Comedy Fantasy",emoji:"🐉",color:"#f6dfce",desc:"A family discovers their new neighbor is a dragon with terrible cooking skills.",chapter:"Smoke Alarm",story:["The new neighbor brought a pie. It was warm, glowing, and smoking gently through the crust.","“I am still learning human ovens,” the dragon admitted. The family invited him in. Together they made cookies—and only one small fire."]},
{title:"After the Applause",author:"V. Lane",genre:"Performing Arts",emoji:"🎭",color:"#f0dff0",desc:"A stage actor faces opening night after a year of self-doubt.",chapter:"Curtain Call",story:["Backstage, Ren forgot every line. The stage manager squeezed his hand and said, “Tell the story. The words will follow.”","The curtain rose. Ren stepped into the light, found the first sentence, and let the character carry him. The applause felt like coming home."]},
{title:"The Blue Umbrella",author:"S. Finch",genre:"Romantic Comedy",emoji:"☂️",color:"#dce7ff",desc:"Two people keep accidentally swapping umbrellas on rainy days.",chapter:"Rain Check",story:["For three weeks, Jo and Eli traded umbrellas without meeting. Each left a tiny message in the handle.","At last, they waited at the bus stop together. “Want to stop swapping umbrellas?” Eli asked. Jo smiled. “Only if we share one.”"]},
{title:"Tomorrow's Garden",author:"R. Green",genre:"Dystopian",emoji:"🌻",color:"#e1edcf",desc:"In a city where plants are forbidden, a student finds a seed in an old book.",chapter:"A Green Secret",story:["The seed was small enough to hide in a pencil case. Noor planted it beneath a loose floorboard and watched a green curl rise.","When the patrol came, classmates formed a circle around the sprout. For the first time, the city saw that hope could grow in the smallest place."]}
];
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(b,i){return `<article class="book"><div class="book-top"><div class="cover" style="--cover:${b.color}">${b.emoji}</div><div><h3>${esc(b.title)}</h3><div class="author">by ${esc(b.author)}</div><span class="tag">${esc(b.genre)}</span></div></div><p>${esc(b.desc)}</p><a class="read" href="#book/${i}">Read Chapter 1 →</a></article>`}
function renderHome(){
app.innerHTML=`<section class="hero"><div><div class="eyebrow">Your next favorite story awaits</div><h1>Turn a page.<br>Find a new world.</h1><p>Explore original short stories across different genres. Every book has one chapter—perfect for a quick reading adventure.</p><a class="read" href="#library">Explore the library</a></div><div class="hero-art" aria-hidden="true">📖✨</div></section>
<section id="library"><div class="section-title"><h2>Story Library</h2><span class="count">30 books · 30 genres & adventures</span></div>
<div class="toolbar"><input id="search" type="search" placeholder="Search title, author, or genre…" aria-label="Search stories"><select id="genre" aria-label="Filter by genre"><option value="All">All genres</option>${[...new Set(books.map(b=>b.genre))].map(g=>`<option>${esc(g)}</option>`).join('')}</select></div><div id="grid" class="grid">${books.map(card).join('')}</div></section>
<section id="about" class="about"><div class="eyebrow">About this project</div><h2>Welcome to PageTurner</h2><p>This student-made story website demonstrates HTML, CSS, and JavaScript. Browse 30 original story entries, filter by genre, and open each book to read its single chapter. The navigation links work on every view.</p></section>`;
const search=document.getElementById('search'),genre=document.getElementById('genre'),grid=document.getElementById('grid');
function filter(){const q=search.value.toLowerCase(),g=genre.value;const results=books.map((b,i)=>({b,i})).filter(({b})=>(g==='All'||b.genre===g)&&`${b.title} ${b.author} ${b.genre} ${b.desc}`.toLowerCase().includes(q));grid.innerHTML=results.length?results.map(({b,i})=>card(b,i)).join(''):'<div class="empty">No stories found. Try another search or genre.</div>'}
search.addEventListener('input',filter);genre.addEventListener('change',filter);
}
function renderBook(i){
const b=books[i];if(!b){location.hash='#home';return}
app.innerHTML=`<article class="page"><a class="back" href="#library">← Back to library</a><header class="story-head"><div class="cover" style="--cover:${b.color}">${b.emoji}</div><span class="tag">${esc(b.genre)}</span><h1>${esc(b.title)}</h1><div class="author">by ${esc(b.author)}</div><p>${esc(b.desc)}</p></header><div class="story-text"><h2>Chapter 1: ${esc(b.chapter)}</h2>${b.story.map(p=>`<p>${esc(p)}</p>`).join('')}</div><div class="story-actions"><a href="#library">← Browse more stories</a><a href="#book/${(i+1)%books.length}">Next story →</a></div></article>`;
}
function route(){const hash=location.hash||'#home';if(hash.startsWith('#book/'))renderBook(Number(hash.split('/')[1]));else renderHome();document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===hash|| (hash.startsWith('#book/')&&a.getAttribute('href')==='#library')));window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
